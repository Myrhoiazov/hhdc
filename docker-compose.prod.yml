services:
  frontend:
    container_name: ${FRONTEND_CONTAINER_NAME:?FRONTEND_CONTAINER_NAME не задан — см. .env.example}
    image: hhdc-frontend:prod
    build:
      context: .
      dockerfile: docker/client/Dockerfile.prod
      args:
        CLIENT_API_URL: ${CLIENT_API_URL_PROD:?CLIENT_API_URL_PROD не задан — см. .env.example}
    restart: unless-stopped
    # Only the host nginx talks to the containers; nothing is published on a public interface.
    ports:
      - "127.0.0.1:${FRONTEND_PORT_PROD:?FRONTEND_PORT_PROD не задан — см. .env.example}:80"
    depends_on:
      - backend
    networks:
      - hhdc-network

  backend:
    container_name: ${BACKEND_CONTAINER_NAME:?BACKEND_CONTAINER_NAME не задан — см. .env.example}
    image: hhdc-backend:prod
    build:
      context: ./server
      dockerfile: ../docker/server/Dockerfile.prod
    restart: unless-stopped
    # Integration and tuning variables (Gmail, Weeztix, Telegram, AI, RAG, workers) come straight
    # from the server's .env; the values below are the ones the stack itself decides.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MODE: production
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-hhdc}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан — см. .env.example}@db:5432/${POSTGRES_DB:-hhdc_crm}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD не задан — см. .env.example}@redis:6379
      CLIENT_URL: ${CLIENT_URL_PROD:?CLIENT_URL_PROD не задан — см. .env.example}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY}
      STORAGE_ROOT: private-uploads
      # One reverse proxy (the host nginx) stands in front of the API.
      TRUST_PROXY_HOPS: 1
    volumes:
      - private_uploads_data:/app/private-uploads
      # Knowledge-base sources: rsynced to the host by the deploy script. Read-only — the app never writes here.
      - ./server/knowledge:/app/knowledge:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT_PROD:?BACKEND_PORT_PROD не задан — см. .env.example}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hhdc-network
