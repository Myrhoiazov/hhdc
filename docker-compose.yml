services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ${POSTGRES_CONTAINER_NAME:-hhdc-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hhdc_crm}
      POSTGRES_USER: ${POSTGRES_USER:-hhdc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан — см. .env.example}
    volumes:
      - postgres_crm_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 10s
      retries: 15
    networks:
      - hhdc-network

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:?REDIS_CONTAINER_NAME не задан — см. .env.example}
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD не задан — см. .env.example}
    ports:
      - "127.0.0.1:${REDIS_PORT:?REDIS_PORT не задан — см. .env.example}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hhdc-network

  ollama:
    image: ollama/ollama:latest
    container_name: ${OLLAMA_CONTAINER_NAME:-hhdc-ollama}
    restart: unless-stopped
    mem_limit: ${OLLAMA_MEM_LIMIT:-2g}
    cpus: ${OLLAMA_CPU_LIMIT:-1.5}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - hhdc-network

volumes:
  postgres_crm_data:
  redis_data:
  ollama_data:
  uploads_data:
  private_uploads_data:

networks:
  hhdc-network:
    driver: bridge
