services:
  frontend:
    container_name: hhdc-client-dev
    image: hhdc-frontend:dev
    build:
      context: .
      dockerfile: docker/client/Dockerfile.dev
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      CLIENT_API_URL: ${CLIENT_API_URL:?CLIENT_API_URL не задан — см. .env.example}
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:?FRONTEND_PORT не задан — см. .env.example}:3000"
    depends_on:
      - backend
    networks:
      - hhdc-network

  backend:
    container_name: hhdc-backend-dev
    image: hhdc-backend:dev
    build:
      context: ./server
      dockerfile: ../docker/server/Dockerfile.dev
    restart: unless-stopped
    working_dir: /app
    environment:
      MODE: development
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-hhdc}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан — см. .env.example}@db:5432/${POSTGRES_DB:-hhdc_crm}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL не задан — см. .env.example}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL не задан — см. .env.example}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-}
      WEEZTIX_CLIENT_ID: ${WEEZTIX_CLIENT_ID:-}
      WEEZTIX_CLIENT_SECRET: ${WEEZTIX_CLIENT_SECRET:-}
      WEEZTIX_REDIRECT_URI: ${WEEZTIX_REDIRECT_URI:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_EMAIL_NOTIFY_CHAT_ID: ${TELEGRAM_EMAIL_NOTIFY_CHAT_ID:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-gpt-4o-mini}
      OPENAI_ALLOWED_MODELS: ${OPENAI_ALLOWED_MODELS:-}
      OPENAI_CONTEXT_LENGTH: ${OPENAI_CONTEXT_LENGTH:-16000}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:0.6b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_QUERY_EXPANSION_ENABLED: ${RAG_QUERY_EXPANSION_ENABLED:-false}
      RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-false}
      RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-qwen3-reranker:0.6b}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-700}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-100}
      RAG_VERSION: ${RAG_VERSION:-v1}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-60000}
      HHDC_EVENT_YEAR: ${HHDC_EVENT_YEAR:-2027}
      RAG_KNOWLEDGE_PATH: ${RAG_KNOWLEDGE_PATH:-knowledge/hhdc-knowledge-v1,knowledge/hhdc-knowledge-v2}
      RAG_RULE_LIMIT: ${RAG_RULE_LIMIT:-3}
      RAG_FACT_LIMIT: ${RAG_FACT_LIMIT:-4}
      RAG_FAQ_LIMIT: ${RAG_FAQ_LIMIT:-2}
      RAG_EXAMPLE_LIMIT: ${RAG_EXAMPLE_LIMIT:-2}
      KNOWLEDGE_BASE_URL: ${KNOWLEDGE_BASE_URL:-}
      KNOWLEDGE_ALLOWED_DOMAINS: ${KNOWLEDGE_ALLOWED_DOMAINS:-}
      KNOWLEDGE_CANONICAL_LANGUAGE: ${KNOWLEDGE_CANONICAL_LANGUAGE:-nl}
      LLM_CONTEXT_LENGTH: ${LLM_CONTEXT_LENGTH:-2048}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-0}
      AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-1}
      AI_EMAIL_CLASSIFICATION_ENABLED: ${AI_EMAIL_CLASSIFICATION_ENABLED:-false}
      AI_EMAIL_DRAFT_ENABLED: ${AI_EMAIL_DRAFT_ENABLED:-false}
      AI_EMAIL_SEND_ENABLED: ${AI_EMAIL_SEND_ENABLED:-false}
      KNOWLEDGE_SYNC_ENABLED: ${KNOWLEDGE_SYNC_ENABLED:-false}
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    ports:
      - "${BACKEND_PORT:?BACKEND_PORT не задан — см. .env.example}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hhdc-network

volumes:
  client_node_modules:
  server_node_modules:
