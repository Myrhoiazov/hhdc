name: hhdc-e2e
services:
  e2e-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: hhdc_crm_e2e
      POSTGRES_USER: hhdc_e2e
      POSTGRES_PASSWORD: ${E2E_DATABASE_PASSWORD:?Set E2E_DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - e2e_postgres_crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
volumes:
  e2e_postgres_crm_data:
