name: CI

permissions: {}

on:
    pull_request:
        branches:
            - develop
            - main
    push:
        branches:
            - develop
            - main

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    client-checks:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: client
        strategy:
            matrix:
                node-version: [20.x]
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Lint TypeScript
              run: npm run lint:ts

            - name: Lint SCSS
              run: npm run lint:scss

            - name: Run unit tests
              run: npm test

            - name: Production build
              run: npm run build:prod
              env:
                  CLIENT_API_URL: https://ci-placeholder.invalid

    server-checks:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: server
        strategy:
            matrix:
                node-version: [20.x]
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build (prisma generate + tsc)
              run: npm run build

            - name: Run tests
              run: npm run test:ci

    docs-links:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false

            - name: Use Node.js 20.x
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 20.x

            - name: Check markdown links
              run: bash scripts/check-markdown-links.sh

    skylos:
        name: skylos-check
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
              with:
                  python-version: "3.12"

            - name: Install Skylos
              run: python -m pip install "skylos>=4.35.0"

            - name: Run Skylos audit
              run: bash scripts/check-skylos.sh
