server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # webpack output has no /static/ prefix (publicPath "/", hashed filenames
    # directly at build root plus a css/ subfolder) — match by extension instead.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
